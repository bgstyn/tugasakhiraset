name: CI/CD — Test & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run automated tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, xml, zip, gd, curl
          coverage: none

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit tests
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          RFID_API_TOKEN: test-rfid-token

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Raspberry Pi scanner without hardware
        working-directory: raspi_asset_iot
        run: |
          python -m pip install requests python-dotenv
          python -m unittest discover -s tests -v

      - name: Test frontend artifact installation
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/install-frontend.sh
          python -m unittest discover -s scripts/tests -v

      - name: Setup Node.js for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend on GitHub runner
        run: |
          npm ci
          npm run build
          printf '%s\n' "$GITHUB_SHA" > public/build/.revision
          tar -czf "$RUNNER_TEMP/frontend-build.tar.gz" -C public build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-build.tar.gz
          if-no-files-found: error
          retention-days: 3

  # ─────────────────────────────────────────
  # JOB 2: Deploy ke AWS EC2 (hanya jika test lulus & push ke main)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: ec2-production
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: ${{ runner.temp }}/frontend

      - name: Upload frontend to EC2
        id: frontend
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail
          directory=$(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" 'mktemp -d /tmp/asset-frontend.XXXXXXXX')
          [[ "$directory" =~ ^/tmp/asset-frontend\.[a-zA-Z0-9]+$ ]]
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/frontend/frontend-build.tar.gz" \
            "$EC2_USERNAME@$EC2_HOST:$directory/frontend-build.tar.gz"

      - name: Preserve or initialize production .env
        env:
          APP_ENV_PRODUCTION: ${{ secrets.APP_ENV_PRODUCTION }}
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail
          remote=(ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "$EC2_USERNAME@$EC2_HOST")
          printf -v env_path '%q' "$EC2_APP_PATH/.env"
          if "${remote[@]}" "test -e $env_path || test -L $env_path"; then
            echo 'Using existing production .env'
            exit 0
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          fi

          if [ -z "$APP_ENV_PRODUCTION" ]; then
            echo 'Production .env is missing and APP_ENV_PRODUCTION is empty.' >&2
            exit 1
          fi

          initialize=$(cat <<'INITIALIZE_ENV'
          set -eu
          env_file=$1
          temporary=$(mktemp "${env_file}.XXXXXX")
          trap 'rm -f -- "$temporary"' EXIT
          cat > "$temporary"
          if ln -T -- "$temporary" "$env_file"; then
            echo 'Initialized production .env'
          elif [ -e "$env_file" ] || [ -L "$env_file" ]; then
            echo 'Using existing production .env'
          else
            exit 1
          fi
          INITIALIZE_ENV
          )
          printf -v command 'bash -c %q -- %s' "$initialize" "$env_path"
          printf '%s' "$APP_ENV_PRODUCTION" | "${remote[@]}" "$command"

      - name: Deploy application via SSH
        env:
          EC2_APP_PATH: ${{ secrets.EC2_APP_PATH }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          FRONTEND_DIRECTORY: ${{ steps.frontend.outputs.directory }}
        run: |
          set -euo pipefail
          printf -v command 'bash -s -- %q %q %q' "$EC2_APP_PATH" "$GITHUB_SHA" "$FRONTEND_DIRECTORY"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" "$command" <<'DEPLOY_SCRIPT'
          set -euo pipefail
          export EC2_APP_PATH=$1
          revision=$2
          directory=$3
          if [ ! -d "$EC2_APP_PATH/.git" ]; then
            sudo mkdir -p "$EC2_APP_PATH"
            sudo chown "$USER:$USER" "$EC2_APP_PATH"
            git clone https://github.com/bgstyn/tugasakhiraset.git "$EC2_APP_PATH"
          fi
          cd "$EC2_APP_PATH"
          git fetch origin main
          # Never pair assets from this run with source from a newer push.
          git merge --ff-only "$revision"
          test "$(git rev-parse HEAD)" = "$revision"
          bash scripts/deploy.sh "$directory/frontend-build.tar.gz" "$revision"
          DEPLOY_SCRIPT

      - name: Remove uploaded temporary artifact
        if: always() && steps.frontend.outputs.directory != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          FRONTEND_DIRECTORY: ${{ steps.frontend.outputs.directory }}
        run: |
          [[ "$FRONTEND_DIRECTORY" =~ ^/tmp/asset-frontend\.[a-zA-Z0-9]+$ ]]
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "rm -f -- '$FRONTEND_DIRECTORY/frontend-build.tar.gz'; rmdir -- '$FRONTEND_DIRECTORY'"

      - name: Notify deploy success
        if: success()
        run: echo "✅ Deploy ke AWS EC2 berhasil pada $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Notify deploy failure
        if: failure()
        run: echo "❌ Deploy gagal! Cek log di GitHub Actions."

