name: CI/CD — Test & Deploy to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run automated tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, xml, zip, gd, curl
          coverage: none

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit tests
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          RFID_API_TOKEN: test-rfid-token

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test Raspberry Pi scanner without hardware
        working-directory: raspi_asset_iot
        run: |
          python -m pip install requests python-dotenv
          python -m unittest discover -s tests -v

  # ─────────────────────────────────────────
  # JOB 2: Deploy ke AWS EC2 (hanya jika test lulus & push ke main)
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Write production .env to EC2
        run: |
          printf '%s' '${{ secrets.APP_ENV_PRODUCTION }}' | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "cat > ${{ secrets.EC2_APP_PATH }}/.env"

      - name: Deploy application via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'DEPLOY_SCRIPT'

          set -e
          APP_PATH="${{ secrets.EC2_APP_PATH }}"

          echo "📁 [0/9] Checking project directory..."
          if [ ! -d "$APP_PATH/.git" ]; then
            echo "⬇️  First deploy — cloning repository..."
            sudo mkdir -p "$APP_PATH"
            sudo chown -R $USER:$USER "$APP_PATH"
            git clone https://github.com/bgstyn/tugasakhiraset.git "$APP_PATH"
          fi

          cd "$APP_PATH"

          echo "📦 [1/9] Git pull latest code..."
          git pull origin main

          echo "🗂️  [2/9] Fix file permissions..."
          sudo mkdir -p storage/logs storage/framework/{cache,sessions,views} bootstrap/cache
          sudo chown -R $USER:$USER storage bootstrap/cache
          sudo chmod -R 775 storage bootstrap/cache
          touch storage/logs/laravel.log
          chmod 664 storage/logs/laravel.log

          echo "🔧 [3/9] Install Composer dependencies..."
          composer install --no-dev --optimize-autoloader --no-interaction

          echo "🎨 [4/9] Install NPM & build assets..."
          npm ci
          npm run build

          echo "🗄️  [5/9] Run database migrations..."
          php artisan migrate --force

          echo "⚡ [6/9] Clear & cache configs..."
          php artisan config:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

          echo "🔄 [7/9] Restart queue workers..."
          php artisan queue:restart

          echo "🌐 [8/9] Set final permissions & reload web server..."
          sudo chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true
          sudo chmod -R 775 storage bootstrap/cache
          sudo systemctl reload nginx 2>/dev/null || \
          sudo systemctl reload apache2 2>/dev/null || \
          echo "⚠️  Web server reload skipped"

          echo ""
          echo "✅ Deploy selesai pada $(date '+%Y-%m-%d %H:%M:%S')"
          DEPLOY_SCRIPT

      - name: Notify deploy success
        if: success()
        run: echo "✅ Deploy ke AWS EC2 berhasil pada $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Notify deploy failure
        if: failure()
        run: echo "❌ Deploy gagal! Cek log di GitHub Actions."

